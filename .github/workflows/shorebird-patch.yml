name: Shorebird Patch

# Manual only: publishes a code-push patch for an existing Shorebird release (no new APK).
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Shorebird release to patch'
        default: '1.0.0+1'
        required: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up signing (keystore, key.properties, google-services.json)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set +x
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/satlok.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/satlok.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Publish patch
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set +x
          args=""
          if [ -n "$APP_KEY" ]; then
            printf '{"APP_KEY":"%s"}' "$APP_KEY" > "$RUNNER_TEMP/dd.json"
            args="--dart-define-from-file=$RUNNER_TEMP/dd.json"
          fi
          shorebird patch android --release-version "${{ inputs.release_version }}" --allow-asset-diffs $args
